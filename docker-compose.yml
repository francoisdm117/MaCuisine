version: '3.8'

services:
  cuisine-locale:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cuisine-locale-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      # Configure automatic LAN/Local network lock to ensure no external IP access
      - RESTRICT_TO_LAN=true
      # Put your Gemini API Key here for free AI recipe ideas & meal structures
      - GEMINI_API_KEY=your_gemini_api_key_here
      # Optionnel: Modèle Gemini à utiliser (ex: gemini-3.5-flash ou gemini-2.5-pro)
      - GEMINI_MODEL=gemini-3.5-flash
    volumes:
      # Stock data and general settings (db.json)
      - ./server-data:/app/server-data
      # Individual recipe files (.json, .md) easily accessible on your host
      - ./recipes:/app/recipes
